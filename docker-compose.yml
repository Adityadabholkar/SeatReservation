services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/seats
      DB_USER: seats
      DB_PASSWORD: seats
      DB_POOL_SIZE: "20"
      ADMIN_TOKEN: admin-secret
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
