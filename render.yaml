# Render Blueprint: New > Blueprint > pick this repo. Creates the web service + a free Postgres.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seats-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_POOL_SIZE
        value: "10"
      - key: TOMCAT_MAX_THREADS
        value: "100"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError"

databases:
  - name: seats-db
    plan: free
